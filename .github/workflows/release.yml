name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/dhunya-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          else
            # Fallback: ephemeral keystore so the pipeline always produces a signed APK.
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias dhunya \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass dhunya -keypass dhunya \
              -dname "CN=Dhunya, O=Dhunya, C=IN"
          fi
          echo "DHUNYA_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        env:
          DHUNYA_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'dhunya' }}
          DHUNYA_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'dhunya' }}
          DHUNYA_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'dhunya' }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Rename outputs
        run: |
          VERSION="${GITHUB_REF_NAME:-snapshot}"
          VERSION="${VERSION#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Dhunya-${VERSION}-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/Dhunya-${VERSION}-release.aab"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dhunya-release
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
